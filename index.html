<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRYHOUNDZUL - AI by Zul</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{height:100vh;overflow:hidden;color:white;background:#0a0018}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(135deg,#0a0018,#1a0033,#0d1b4a)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7;animation:float 12s infinite alternate}
.blob1{width:420px;height:420px;background:#A855F7;top:-80px;left:-80px}
.blob2{width:380px;height:380px;background:#00E5FF;bottom:-80px;right:-40px;animation-delay:2s}
.blob3{width:300px;height:300px;background:#EC4899;top:40%;left:45%;animation-delay:4s;opacity:.5}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.15)}}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.25);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3)}
header{margin:14px 14px 0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px}
.logo span{background:linear-gradient(90deg,#00E5FF,#A855F7,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:11px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
.btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:white;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.25)}
main{height:calc(100vh - 150px);margin:14px;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:14px}
#chat::-webkit-scrollbar{width:5px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:99px}
.welcome{text-align:center;margin:auto;max-width:520px}
.welcome h1{font-size:30px;line-height:1.2}
.welcome h1 span{background:linear-gradient(90deg,#00E5FF,#A855F7,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{opacity:.8;font-size:14px;margin:10px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{cursor:pointer;padding:9px 14px;font-size:13px}
.chip:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.msg{max-width:85%;padding:13px 16px;font-size:14.5px;line-height:1.6;animation:up .3s ease;white-space:pre-wrap;word-break:break-word}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(168,85,247,.5),rgba(236,72,153,.5));border-radius:22px 22px 4px 22px}
.msg.ai{align-self:flex-start;border-radius:22px 22px 22px 4px}
.msg.ai b{color:#00E5FF}
.ai-label{font-size:11px;opacity:.7;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ai-label i{width:22px;height:22px;background:linear-gradient(135deg,#00E5FF,#A855F7);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.msg pre{background:rgba(0,0,0,.45);padding:12px;border-radius:14px;overflow-x:auto;font-size:13px;margin:8px 0;position:relative}
.msg code{font-family:monospace}
.copyBtn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.2);border:none;color:white;padding:4px 8px;border-radius:8px;cursor:pointer;font-size:11px}
